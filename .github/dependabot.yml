version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /ui
    schedule: { interval: weekly }
    groups:
      ui: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /image/pi
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /image
    schedule: { interval: weekly }
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
