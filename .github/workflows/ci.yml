name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      WEILO_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - name: Postgres binaries
        run: test -x "$WEILO_PG_BIN/initdb" || (sudo apt-get update && sudo apt-get install -y postgresql-16)
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Generated TypeScript is up to date
        run: git diff --exit-code -- apps/web/src/proto

  # The same tests on a Mac: keep-awake, process groups, paths and Postgres differ there.
  host-macos:
    runs-on: macos-14
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - name: Postgres binaries
        run: |
          brew install postgresql@16
          echo "WEILO_PG_BIN=$(brew --prefix postgresql@16)/bin" >> "$GITHUB_ENV"
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      WEILO_PG_BIN: /usr/lib/postgresql/16/bin
      WEILO_E2E_REQUIRE_PG: "1"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - name: Postgres 16 (from the PGDG repo when the runner's apt doesn't have it)
        run: |
          test -x "$WEILO_PG_BIN/initdb" && exit 0
          sudo apt-get update
          if ! apt-cache show postgresql-16 >/dev/null 2>&1; then
            sudo apt-get install -y postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          fi
          sudo apt-get install -y postgresql-16
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-results
          path: apps/web/e2e/.results
          retention-days: 7
