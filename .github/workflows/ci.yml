name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - run: npm ci
      - name: Type-check the daemon
        run: npm run check
      - name: Test the daemon
        run: npm test
      - name: Type-check and build the UI
        working-directory: ui
        run: npm ci && npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          load: true
          tags: ghcr.io/shyam1203/weilo-agents:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the app and its sandbox
        env:
          WEILO_VERSION: ci
        run: |
          mkdir -p "$HOME/.weilo-agents/isolated" "$HOME/.weilo-agents/isolated-sessions" "$HOME/.weilo-agents/isolated-homes" "$HOME/.weilo-agents/agent/skills" "$HOME/.weilo-agents/agent/extensions"
          docker compose up -d --no-build
          for i in $(seq 1 60); do curl -fs http://localhost:3210/api/health && break; sleep 2; done
          curl -fs http://localhost:3210/api/health
      - name: The sandbox makes namespaces
        run: docker exec weilo-core node --input-type=module -e 'const s = await (await import("/app/sandbox/client.mjs")).sandboxStatus(); console.log(s); process.exit(s.namespaces ? 0 : 1)'
      - name: Logs
        if: always()
        run: docker compose logs
