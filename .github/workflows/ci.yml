name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its run still going; runs on main all finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      WEILO_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # One Rust for building and for the README: rust-version in Cargo.toml is the pinned one.
      - name: Cargo.toml's rust-version matches rust-toolchain.toml
        run: |
          pinned="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          declared="$(sed -n '/^\[workspace.package\]/,/^\[/s/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          [ "$pinned" = "$declared" ] || [ "$pinned" = "$declared.0" ] || {
            echo "::error::rust-toolchain.toml pins $pinned but Cargo.toml says rust-version = \"$declared\". Make them the same."
            exit 1
          }
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Postgres binaries
        run: test -x "$WEILO_PG_BIN/initdb" || (sudo apt-get update && sudo apt-get install -y postgresql-16)
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Generated TypeScript is up to date
        run: git diff --exit-code -- apps/web/src/proto
      # The e2e job uses this binary instead of building its own.
      - run: cargo build --locked -p weilo-host
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weilo-host-linux
          path: target/debug/weilo
          retention-days: 1

  # The same tests on a Mac: keep-awake, process groups, paths and Postgres differ there.
  # Clippy too, for the Mac-only code; formatting is the same everywhere.
  host-macos:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Postgres binaries
        run: |
          brew install postgresql@16
          echo "WEILO_PG_BIN=$(brew --prefix postgresql@16)/bin" >> "$GITHUB_ENV"
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  install-script:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh -n install.sh
      - run: shellcheck install.sh .github/scripts/*.sh
      - name: CHANGELOG.md has a section for the version in Cargo.toml
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          .github/scripts/release-notes.sh "$version" >/dev/null

  e2e:
    needs: host
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEILO_PG_BIN: /usr/lib/postgresql/16/bin
      WEILO_E2E_REQUIRE_PG: "1"
      # The host binary from the host job, so this job doesn't build it again.
      WEILO_E2E_HOST_BIN: ${{ github.workspace }}/target/debug/weilo
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: weilo-host-linux
          path: target/debug
      - run: chmod +x "$WEILO_E2E_HOST_BIN"
      - name: Postgres 16 (from the PGDG repo when the runner's apt doesn't have it)
        run: |
          test -x "$WEILO_PG_BIN/initdb" && exit 0
          sudo apt-get update
          if ! apt-cache show postgresql-16 >/dev/null 2>&1; then
            sudo apt-get install -y postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          fi
          sudo apt-get install -y postgresql-16
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: apps/web/e2e/.results
          retention-days: 7
