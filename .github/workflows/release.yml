name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release run per tag at a time, and none is cancelled halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: Check the tag matches the version in Cargo.toml
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          [ "${GITHUB_REF_NAME#v}" = "$version" ] || { echo "Tag $GITHUB_REF_NAME does not match Cargo.toml ($version)"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check CHANGELOG.md has a section for this version (it becomes the release notes)
        run: .github/scripts/release-notes.sh "${GITHUB_REF_NAME#v}"
      - run: sh -n install.sh && shellcheck install.sh

  # The same checks as CI, with a real Postgres, before anything is built.
  test:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Postgres binaries (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "WEILO_PG_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
          test -x /usr/lib/postgresql/16/bin/initdb || (sudo apt-get update && sudo apt-get install -y postgresql-16)
      - name: Postgres binaries (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@16
          echo "WEILO_PG_BIN=$(brew --prefix postgresql@16)/bin" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The browser tests against a real `weilo up`, as in CI.
  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      WEILO_PG_BIN: /usr/lib/postgresql/16/bin
      WEILO_E2E_REQUIRE_PG: "1"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Postgres 16 (from the PGDG repo when the runner's apt doesn't have it)
        run: |
          test -x "$WEILO_PG_BIN/initdb" && exit 0
          sudo apt-get update
          if ! apt-cache show postgresql-16 >/dev/null 2>&1; then
            sudo apt-get install -y postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          fi
          sudo apt-get install -y postgresql-16
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: apps/web/e2e/.results
          retention-days: 7

  web:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: apps/web/dist

  # Release binaries are built without a cache, from a clean target folder.
  build:
    needs: [check, test, e2e, web]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      VERSION: ${{ needs.check.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustup target add "$TARGET"
      - name: Build
        run: cargo build --release --locked -p weilo-host --target "$TARGET"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: web
      # Signed with a Developer ID and notarized by Apple, so macOS opens it without a
      # warning. Without the Apple secrets this step does nothing and the Mac build is unsigned.
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -eu
          have=0
          for s in "$APPLE_CERT_P12" "$APPLE_CERT_PASSWORD" "$APPLE_ID" "$APPLE_TEAM_ID" "$APPLE_APP_PASSWORD"; do
            [ -n "$s" ] && have=$((have + 1))
          done
          if [ "$have" = 0 ]; then
            echo "::notice::The Apple signing secrets aren't set, so the Mac build isn't signed or notarized."
            exit 0
          fi
          if [ "$have" != 5 ]; then
            echo "::error::Only some of the Apple signing secrets are set. Set all five: APPLE_CERT_P12, APPLE_CERT_PASSWORD, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD."
            exit 1
          fi
          keychain="$RUNNER_TEMP/weilo-sign.keychain-db"
          pass="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          [ -n "$identity" ] || { echo "::error::APPLE_CERT_P12 has no Developer ID Application certificate."; exit 1; }

          bin="target/$TARGET/release/weilo"
          codesign --force --timestamp --options runtime --sign "$identity" "$bin"
          codesign --verify --strict --verbose=2 "$bin"

          # A bare program can't have the ticket stapled; macOS looks it up online instead.
          ditto -c -k --keepParent "$bin" "$RUNNER_TEMP/weilo.zip"
          result="$(xcrun notarytool submit "$RUNNER_TEMP/weilo.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --wait --timeout 30m --output-format json)"
          echo "$result"
          status="$(printf '%s' "$result" | jq -r .status)"
          if [ "$status" != Accepted ]; then
            id="$(printf '%s' "$result" | jq -r .id)"
            xcrun notarytool log "$id" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" || true
            echo "::error::Apple didn't notarize the Mac build ($status)."
            exit 1
          fi
          security delete-keychain "$keychain"
      - name: Check it starts
        run: |
          out="$(target/"$TARGET"/release/weilo version)"
          [ "$out" = "weilo $VERSION" ] || { echo "Got: $out"; exit 1; }
      - name: Package
        run: |
          name="weilo-$VERSION-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/weilo" README.md SECURITY.md CHANGELOG.md "$name/"
          cp -R web "$name/web"
          tar -czf "$name.tar.gz" "$name"
          rm -rf "$name"
      - name: Postgres 16 for the smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          test -x /usr/lib/postgresql/16/bin/initdb && exit 0
          sudo apt-get update
          if ! apt-cache show postgresql-16 >/dev/null 2>&1; then
            sudo apt-get install -y postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          fi
          sudo apt-get install -y postgresql-16
      - name: Postgres 16 for the smoke test (macOS)
        if: runner.os == 'macOS'
        run: brew install postgresql@16
      # What a person gets: unpack the package, `weilo up` (finding Postgres by itself and the
      # web app beside the program), check /api/health and the page, then stop it.
      - name: Smoke test the package
        run: |
          name="weilo-$VERSION-$TARGET"
          dir="$(mktemp -d)"
          chmod 711 "$dir"
          tar -xzf "$name.tar.gz" -C "$dir"
          home="$dir/home"
          "$dir/$name/weilo" up --port 0 --home "$home" >"$dir/up.log" 2>&1 &
          pid=$!
          ok=""
          for _ in $(seq 1 120); do
            port="$(sed -n 's/.*"port":\([0-9][0-9]*\).*/\1/p' "$home/host.json" 2>/dev/null || true)"
            if [ -n "$port" ] && health="$(curl -fsS "http://127.0.0.1:$port/api/health")"; then
              echo "health: $health"
              page="$(curl -fsS "http://127.0.0.1:$port/")"
              case "$health" in
                *"\"version\":\"$VERSION\""*) ;;
                *) echo "::error::/api/health didn't say version $VERSION"; break ;;
              esac
              case "$page" in
                *"isn't built yet"* | "") echo "::error::The web app in the package isn't served"; break ;;
              esac
              ok=1
              break
            fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          kill -TERM "$pid" 2>/dev/null || true
          stopped=""
          for _ in $(seq 1 30); do
            kill -0 "$pid" 2>/dev/null || { stopped=1; break; }
            sleep 1
          done
          [ -n "$stopped" ] || { echo "::error::weilo didn't stop within 30 s"; kill -KILL "$pid" || true; ok=""; }
          echo "--- weilo up log"; cat "$dir/up.log"
          [ -n "$ok" ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: weilo-*.tar.gz

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: "*-*-*"
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum weilo-*.tar.gz > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/weilo-*.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          .github/scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          # shellcheck disable=SC2086 # $flags is empty or one word
          gh release create "$GITHUB_REF_NAME" dist/weilo-*.tar.gz dist/SHA256SUMS install.sh \
            --title "Weilo $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag $flags
