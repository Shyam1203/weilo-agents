name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check the tag matches VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          [ "${GITHUB_REF_NAME#v}" = "$version" ] || { echo "Tag $GITHUB_REF_NAME does not match VERSION ($version)"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Check
        run: npm ci && npm run check

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.IMAGE }}
          tags: type=semver,pattern={{version}}

      - name: Build the image for this runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: image/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start it and check it
        env:
          WEILO_VERSION: ${{ env.VERSION }}
        run: .github/scripts/smoke.sh

      - name: Build for arm64 and check it starts
        run: |
          docker buildx build --platform linux/arm64 --load -t weilo-arm64 -f image/Dockerfile --build-arg VERSION="$VERSION" .
          docker run --rm --platform linux/arm64 --entrypoint sh weilo-arm64 -c 'node -e "require(\"node:sqlite\")" && node --check /app/server.mjs && test -x "$(readlink -f /usr/local/bin/pi)"'

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip "weilo-agents-$VERSION.zip" compose.yaml start.sh start.cmd update.sh update.cmd VERSION README.md SECURITY.md
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "weilo-agents-$VERSION.zip" --generate-notes --verify-tag $flags
