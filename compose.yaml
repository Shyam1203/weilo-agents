name: weilo-agents

services:
  core:
    # `docker compose pull` gets the released image for WEILO_VERSION (the start scripts set it from the VERSION file);
    # `docker compose up -d --build` builds this checkout instead and names it the same.
    image: ghcr.io/shyam1203/weilo-agents:${WEILO_VERSION:-latest}
    build:
      context: .
      dockerfile: image/Dockerfile
      args:
        VERSION: ${WEILO_VERSION:-dev}
        COMMIT: ${WEILO_COMMIT:-unknown}
    container_name: weilo-core
    init: true
    restart: unless-stopped
    cap_drop: [NET_RAW, NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    # Chromium needs more shared memory than the default 64 MB.
    shm_size: 1gb
    ports:
      - "127.0.0.1:3210:3210"
    volumes:
      - ${USERPROFILE:-${HOME}}/.weilo-agents:/home/node/.pi
      - tools:/home/node/.local
      - browser:/home/node/.browser

volumes:
  tools:
  browser:
