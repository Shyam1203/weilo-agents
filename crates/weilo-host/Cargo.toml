[package]
name = "weilo-host"
description = "The core of Weilo: runs Postgres, engines and the app's server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "weilo"
path = "src/main.rs"

[lib]
name = "weilo_host"
path = "src/lib.rs"

[dependencies]
weilo-proto = { path = "../weilo-proto" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
agent-client-protocol = "3.5"
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
include_dir = "0.7"
libc = "0.2"
rand = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }

[dev-dependencies]
tokio-tungstenite = "0.28"
tempfile = "3"
