<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: Geist, system-ui, sans-serif; color: #FAFAF9; background: #0C0A09; display: flex; flex-direction: column; font-size: 16px; line-height: 24px; padding: 48px 16px 34px; overflow: hidden">

<span style="color: #A8A29E">Ava · 2:14</span>
<span style="justify-self: end; display: flex; align-items: center; gap: 6px; color: #FAFAF9"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: #4ADE80"></span>Mic on</span>

<div style="display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 16px 0 24px">

<div aria-label="Captions" aria-live="polite" style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 12px; line-height: 16px; color: #A8A29E; font-weight: 500">You</div>
<div style="font-size: 20px; line-height: 28px; color: #A8A29E">Move my 3 o'clock with Mark to tomorrow.</div>
<div style="font-size: 12px; line-height: 16px; color: #A8A29E; font-weight: 500; padding-top: 12px">Ava</div>

<div style="font-size: 15px; line-height: 20px; font-weight: 600">Move your meeting with Mark Chen?</div>
<div style="font-size: 13px; line-height: 20px; color: #A8A29E">Today 3:00 → tomorrow 3:00 · Mark gets an update</div>
<div style="display: flex; gap: 8px; padding-top: 4px"><button style="flex: 1; height: 48px; border: 1px solid #57534E; background: transparent; color: #FAFAF9; border-radius: 8px; font-size: 15px; font-weight: 500">Change</button><button style="flex: 1; height: 48px; border: 0; background: #8B7CF0; color: #0C0A09; border-radius: 8px; font-size: 15px; font-weight: 500">Move</button></div>

<button style="flex: 1; height: 48px; border: 0; background: #DC2626; color: #FFFFFF; border-radius: 999px; font-size: 15px; font-weight: 500">End</button>
