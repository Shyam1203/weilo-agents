<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 24px">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 600; letter-spacing: -0.01em">Scan the code on your computer</h1>
<p style="margin: 0; color: #57534E">On your computer, open Weilo → Add a phone, then point your camera at the code.</p>
</div>

<div aria-label="Camera" style="margin-top: 32px; align-self: center; width: 280px; height: 280px; border-radius: 16px; background: #1C1917; position: relative; overflow: hidden">
<span aria-hidden="true" style="position: absolute; left: 40px; top: 40px; width: 40px; height: 40px; border-left: 4px solid #FFFFFF; border-top: 4px solid #FFFFFF; border-radius: 12px 0 0 0"></span>
<span aria-hidden="true" style="position: absolute; right: 40px; top: 40px; width: 40px; height: 40px; border-right: 4px solid #FFFFFF; border-top: 4px solid #FFFFFF; border-radius: 0 12px 0 0"></span>
<span aria-hidden="true" style="position: absolute; left: 40px; bottom: 40px; width: 40px; height: 40px; border-left: 4px solid #FFFFFF; border-bottom: 4px solid #FFFFFF; border-radius: 0 0 0 12px"></span>
<span aria-hidden="true" style="position: absolute; right: 40px; bottom: 40px; width: 40px; height: 40px; border-right: 4px solid #FFFFFF; border-bottom: 4px solid #FFFFFF; border-radius: 0 0 12px 0"></span>
</div>

<div style="display: flex; justify-content: center; padding-top: 24px">
<button style="height: 44px; border: 1px solid #E7E5E4; background: #FFFFFF; color: #1C1917; border-radius: 8px; padding: 0 16px; font-size: 16px; line-height: 24px; font-weight: 500">Type the code instead</button>
</div>

<div style="flex: 1"></div>

<p style="margin: 0; font-size: 13px; line-height: 20px; color: #57534E; text-align: center">Next, you'll check that both screens show the same 4 words.<br><a href="#" style="font-weight: 500">No Weilo on your computer yet? Send me the link</a></p>
