<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#43369A;text-decoration:none}a:hover{color:#43369A;text-decoration:underline}
button{font-family:inherit;cursor:pointer}
.w-row:hover{background:#F5F5F4;text-decoration:none}
.w-sec{position:relative}
.w-sec .w-add{opacity:0;position:absolute;right:4px;top:2px;background:#FAFAF9}
.w-sec:hover .w-add,.w-sec:focus-within .w-add{opacity:1}
.w-rail:hover{background:#E7E5E4;text-decoration:none}
.w-ghost:hover{background:#F5F5F4}
.w-search:focus-within{outline:2px solid #5B4BC4;outline-offset:2px}
button:focus-visible,a:focus-visible{outline:2px solid #5B4BC4;outline-offset:2px}
</style>
</helmet>
<div style="font-family: Geist, system-ui, sans-serif; color: #1C1917; display: flex; height: 900px; font-size: 13px; line-height: 20px; position: relative">

<nav aria-label="Pages" style="width: 80px; flex: 0 0 80px; background: #F5F5F4; border-right: 1px solid #E7E5E4; display: flex; flex-direction: column; align-items: center; box-sizing: border-box">
<div style="height: 56px; flex: 0 0 56px; display: flex; align-items: center; justify-content: center"><span style="height: 32px; width: 32px; border-radius: 8px; background: #5B4BC4; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; line-height: 20px">W</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 8px">
<sc-for list="{{ pages }}" as="p" hint-placeholder-count="3">
<a href="#" class="w-rail" aria-current="{{ p.current }}" style="{{ p.style }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ p.icon }}"></path></svg><span>{{ p.label }}</span></a>
</sc-for>
</div>
<div style="flex: 1"></div>
<a href="#" class="w-rail" style="width: 72px; padding: 8px 0; margin-bottom: 12px; border-radius: 8px; color: #57534E; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg><span>Settings</span></a>
</nav>

<aside aria-label="Sidebar" style="width: 272px; flex: 0 0 272px; background: #FAFAF9; border-right: 1px solid #E7E5E4; display: flex; flex-direction: column; box-sizing: border-box">
<div style="height: 56px; flex: 0 0 56px; display: flex; align-items: center; padding: 0 12px; box-shadow: inset 0 -1px 0 #E7E5E4; box-sizing: border-box">
<label class="w-search" style="flex: 1; min-width: 0; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border: 1px solid #E7E5E4; border-radius: 8px; background: #FFFFFF; color: #78716C; box-sizing: border-box"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input type="text" placeholder="Search or jump to…" aria-label="Search" style="flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; color: #1C1917; background: transparent"><span style="font-size: 12px; line-height: 16px; color: #78716C; border: 1px solid #E7E5E4; border-radius: 6px; padding: 0 4px">⌘K</span></label>
</div>

<div style="flex: 1; overflow: hidden; padding: 12px 8px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 2px">
<a href="NeedsYou.dc.html" class="w-row" aria-current="{{ needsCurrent }}" style="{{ needsStyle }}"><span style="flex: 0 0 24px; display: flex; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13h4l2 3h4l2-3h4M5 13l2-8h10l2 8v6H5z"></path></svg></span><span style="flex: 1">Needs you</span><span style="min-width: 20px; height: 20px; padding: 0 4px; box-sizing: border-box; border-radius: 999px; background: #B45309; color: #FFFFFF; font-size: 12px; line-height: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center">2</span></a>
<sc-if value="{{ pinAva }}" hint-placeholder-val="{{ false }}">
<a href="#" class="w-row" style="height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 8px; color: #1C1917; font-weight: 500; box-sizing: border-box"><span style="flex: 0 0 24px; height: 24px; border-radius: 999px; background: #EEEBFB; color: #43369A; display: flex; align-items: center; justify-content: center; font-size: 12px; line-height: 16px; font-weight: 600">A</span>Chat with Ava</a>
</sc-if>
</div>

<sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
<div style="padding: 0 8px; display: flex; flex-direction: column; gap: 8px; color: #57534E"><span><b style="font-weight: 600; color: #1C1917">Your sidebar is empty.</b></span><button onClick="{{ showAll }}" class="w-ghost" style="align-self: flex-start; height: 28px; border: 1px solid #E7E5E4; background: #FFFFFF; border-radius: 6px; padding: 0 8px; font-size: 13px; font-weight: 500; color: #1C1917">Show all</button></div>
</sc-if>

<sc-for list="{{ sections }}" as="sec" hint-placeholder-count="3">
<section aria-label="{{ sec.title }}" style="display: flex; flex-direction: column; gap: 2px">
<div class="w-sec" style="height: 28px; display: flex; align-items: center; padding: 0 8px">
<button aria-expanded="{{ sec.open }}" onClick="{{ sec.toggle }}" style="flex: 1; height: 28px; display: flex; align-items: center; gap: 4px; border: 0; background: transparent; padding: 0; color: #78716C; font-size: 12px; line-height: 16px; font-weight: 500; text-align: left"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{ sec.chevron }}"><path d="M6 9l6 6 6-6"></path></svg><span style="flex: 1">{{ sec.title }}</span><span>{{ sec.countLabel }}</span></button>
<button class="w-add w-ghost" aria-label="{{ sec.addLabel }}" style="width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: #57534E; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<sc-if value="{{ sec.open }}" hint-placeholder-val="{{ true }}">
<sc-for list="{{ sec.rows }}" as="r" hint-placeholder-count="3">
<a href="{{ r.href }}" class="w-row" aria-current="{{ r.current }}" style="{{ r.style }}">
<span style="{{ r.leadStyle }}">{{ r.lead }}<sc-if value="{{ r.isSession }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4"></path></svg></sc-if></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="{{ r.nameStyle }}">{{ r.name }}</span><sc-if value="{{ r.hasSub }}" hint-placeholder-val="{{ true }}"><span style="{{ r.subStyle }}">{{ r.sub }}</span></sc-if></span>
<sc-if value="{{ r.dot }}" hint-placeholder-val="{{ false }}"><span aria-label="New" style="width: 6px; height: 6px; border-radius: 999px; background: #5B4BC4"></span></sc-if>
</a>
</sc-for>
</sc-if>
</section>
</sc-for>
</div>

<div style="padding: 8px; border-top: 1px solid #E7E5E4; position: relative">
<button onClick="{{ toggleCustomize }}" aria-expanded="{{ customize }}" class="w-ghost" style="width: 100%; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: #57534E; font-size: 13px; line-height: 20px; font-weight: 500; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path></svg><span style="flex: 1">Customize sidebar</span><sc-if value="{{ hiddenLive }}" hint-placeholder-val="{{ false }}"><span aria-label="A hidden section has live work" style="width: 6px; height: 6px; border-radius: 999px; background: #B45309"></span></sc-if></button>
<sc-if value="{{ customize }}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-label="Customize sidebar" style="position: absolute; left: 8px; bottom: 48px; width: 240px; background: #FFFFFF; border: 1px solid #E7E5E4; border-radius: 12px; box-shadow: 0 8px 24px rgba(28,25,23,0.12); padding: 8px; display: flex; flex-direction: column; gap: 2px; box-sizing: border-box">
<div style="padding: 4px 8px 8px; font-size: 12px; line-height: 16px; font-weight: 500; color: #78716C">Show in sidebar</div>
<sc-for list="{{ switches }}" as="s" hint-placeholder-count="4">
<div style="height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 8px"><span style="flex: 1">{{ s.label }}</span><button role="switch" aria-checked="{{ s.on }}" aria-label="{{ s.aria }}" onClick="{{ s.flip }}" style="{{ s.track }}"><span style="width: 16px; height: 16px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(28,25,23,0.06)"></span></button></div>
</sc-for>
<div style="padding: 8px; font-size: 12px; line-height: 16px; color: #57534E">Hidden sections still send alerts to Needs you.</div>
<div style="display: flex; justify-content: flex-end; padding: 0 8px 4px"><button onClick="{{ toggleCustomize }}" style="height: 28px; border: 0; background: #5B4BC4; color: #FFFFFF; border-radius: 6px; padding: 0 12px; font-size: 13px; font-weight: 500">Done</button></div>
</div>
</sc-if>
</div>
</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["shop","fix","needs"],"default":"shop"},"customize":{"editor":"boolean","default":false},"hideSessions":{"editor":"boolean","default":false},"$preview":{"width":352,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      open: { agents: true, channels: true, sessions: true, archived: false },
      show: { agents: true, channels: true, sessions: !props.hideSessions, archived: true },
      customize: !!props.customize
    };
  }
  renderVals() {
    const active = this.props.active ?? 'shop';
    const st = this.state;
    const page = (label, icon, current) => ({
      label, icon, current: current ? 'page' : 'false',
      style: 'width: 72px; padding: 8px 0; border-radius: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 500; ' + (current ? 'background: #FFFFFF; color: #1C1917; box-shadow: 0 1px 2px rgba(28,25,23,0.06)' : 'color: #57534E')
    });
    const pages = [
      page('Home', 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z', active !== 'needs'),
      page('Routines', 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M12 7v5l3 2', false),
      page('Connections', 'M9 7V3M15 7V3M7 7h10v4a5 5 0 0 1-10 0zM12 16v5', false)
    ];
    const rowBase = 'display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 8px; color: #1C1917; box-sizing: border-box; ';
    const row = (o) => {
      const sel = o.id === active;
      const two = !!o.sub;
      const lead = o.kind === 'agent'
        ? 'flex: 0 0 24px; height: 24px; border-radius: 999px; background: ' + o.bg + '; color: ' + o.fg + '; display: flex; align-items: center; justify-content: center; font-size: 12px; line-height: 16px; font-weight: 600'
        : o.kind === 'channel'
          ? 'flex: 0 0 24px; text-align: center; font-size: 14px; font-weight: 500; color: ' + (sel ? '#43369A' : '#78716C')
          : 'flex: 0 0 24px; height: 24px; border-radius: 6px; background: ' + (sel ? '#FFFFFF' : '#F5F5F4') + '; color: #57534E; display: flex; align-items: center; justify-content: center';
      return {
        ...o,
        href: o.href || '#',
        current: sel ? 'page' : 'false',
        hasSub: two,
        isSession: o.kind === 'session',
        dot: !!o.dot,
        style: rowBase + 'height: ' + (two ? 44 : 32) + 'px; ' + (sel ? 'background: #EEEBFB;' : ''),
        leadStyle: lead,
        lead: o.kind === 'agent' ? o.initial : o.kind === 'channel' ? '#' : '',
        nameStyle: 'white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; color: ' + (sel ? '#43369A' : '#1C1917'),
        subStyle: 'font-size: 12px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (o.subTone === 'ok' ? '#15803D' : o.subTone === 'warn' ? '#B45309' : (sel ? '#57534E' : '#78716C'))
      };
    };
    const toggle = (k) => () => this.setState({ open: { ...st.open, [k]: !st.open[k] } });
    const chev = (k) => 'transition: transform 120ms; transform: rotate(' + (st.open[k] ? 0 : -90) + 'deg)';
    const agents = [
      { id: 'ava', kind: 'agent', initial: 'A', bg: '#EEEBFB', fg: '#43369A', name: 'Ava', sub: 'Checking the shop page', subTone: 'ok' },
      { id: 'mia', kind: 'agent', initial: 'M', bg: '#FCE7F3', fg: '#9D174D', name: 'Mia · Social', sub: 'Next post at 6 pm' }
    ].map(row);
    const channels = [
      { id: 'general', kind: 'channel', name: 'general' },
      { id: 'shop', kind: 'channel', name: 'shop-launch', href: 'Main.dc.html' },
      { id: 'taxes', kind: 'channel', name: 'taxes-2026', dot: true },
      { id: 'trip', kind: 'channel', name: 'trip' }
    ].map(row);
    const sessions = [
      { id: 'fix', kind: 'session', name: 'Fix checkout', sub: 'Started by Ava · needs you', subTone: 'warn', href: 'Session.dc.html' },
      { id: 'dark', kind: 'session', name: 'Dark mode for the store', sub: 'Started by you · working', subTone: 'ok' }
    ].map(row);
    const archived = [{ id: 'xmas', kind: 'channel', name: 'holiday-sale' }].map(row);
    const sec = (k, title, addLabel, count, rows) => ({ title, addLabel, open: st.open[k], toggle: toggle(k), chevron: chev(k), countLabel: st.open[k] ? '' : count, rows });
    const sections = [];
    if (st.show.agents) sections.push(sec('agents', 'Agents', 'New agent', '1 working', agents));
    if (st.show.channels) sections.push(sec('channels', 'Channels', 'New channel', '1 new', channels));
    if (st.show.sessions) sections.push(sec('sessions', 'Sessions', 'New session', '1 needs you', sessions));
    if (st.show.archived) sections.push(sec('archived', 'Archived', 'Archive a channel', '', archived));
    const sw = (k, label) => {
      const on = st.show[k];
      return {
        label, on: on ? 'true' : 'false', aria: 'Show ' + label,
        flip: () => this.setState({ show: { ...st.show, [k]: !on } }),
        track: 'width: 32px; height: 20px; border-radius: 999px; border: 0; padding: 2px; display: flex; box-sizing: border-box; justify-content: ' + (on ? 'flex-end' : 'flex-start') + '; background: ' + (on ? '#5B4BC4' : '#A8A29E')
      };
    };
    const needsSel = active === 'needs';
    const anyShown = st.show.agents || st.show.channels || st.show.sessions || st.show.archived;
    return {
      pages,
      sections,
      empty: !anyShown,
      showAll: () => this.setState({ show: { agents: true, channels: true, sessions: true, archived: true } }),
      pinAva: !st.show.agents,
      hiddenLive: !st.show.sessions,
      customize: st.customize,
      toggleCustomize: () => this.setState({ customize: !st.customize }),
      switches: [sw('agents', 'Agents'), sw('channels', 'Channels'), sw('sessions', 'Sessions'), sw('archived', 'Archived')],
      needsCurrent: needsSel ? 'page' : 'false',
      needsStyle: rowBase + 'height: 32px; font-weight: 500; color: ' + (needsSel ? '#43369A' : '#1C1917') + '; ' + (needsSel ? 'background: #EEEBFB;' : '')
    };
  }
}
</script>
</body>
</html>
